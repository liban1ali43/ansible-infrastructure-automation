---
- name: Configure haproxy
  hosts: all
  tasks:
    - name: Install the latest version of haproxy
      ansible.builtin.yum:
        name: haproxy
        state: latest
      when: inventory_hostname in groups['balancers']
    - name: Start service haproxy, if not started
      ansible.builtin.service:
        name: haproxy
        state: started
        enabled: yes
      when: inventory_hostname in groups['balancers']

    - name: Deploy HAProxy configuration
      ansible.builtin.template:
        src: ./haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        validate: "/usr/sbin/haproxy -c -f %s"
      when: inventory_hostname in groups['balancers']    
      notify: Restart HAProxy

    - name: Permanently enable http service
      ansible.posix.firewalld:
        service: http
        state: enabled
        permanent: true
        immediate: true

  handlers:
    - name: Restart HAProxy
      ansible.builtin.service:
        name: haproxy
        state: restarted
      when: inventory_hostname in groups['balancers']    
